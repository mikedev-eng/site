<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ma Boutique</title>
<style>
  :root {
    --vert: #1f5c3a;
    --vert-clair: #e4efe8;
    --jaune: #f2b705;
    --fond: #f6f8f5;
    --texte: #1d2420;
    --gris: #5d6862;
    --bord: #d9e0db;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Georgia, "Times New Roman", serif; background: var(--fond); color: var(--texte); line-height: 1.5; }
  button, input, select { font: inherit; }
  :focus-visible { outline: 3px solid var(--jaune); outline-offset: 2px; }

  /* ===== EN-TÊTE ===== */
  header { background: var(--vert); color: #fff; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
  header h1 { font-size: 1.4rem; }
  #btn-panier { background: var(--jaune); color: #1d2420; border: 0; border-radius: 999px; padding: 8px 16px; font-weight: bold; cursor: pointer; }

  /* ===== PRÉSENTATION ===== */
  .intro { max-width: 900px; margin: 0 auto; padding: 32px 20px 12px; }
  .intro h2 { font-size: 2rem; line-height: 1.2; margin-bottom: 8px; }
  .intro p { color: var(--gris); max-width: 60ch; }

  /* ===== FILTRES ===== */
  .filtres { max-width: 900px; margin: 0 auto; padding: 16px 20px; display: flex; gap: 10px; flex-wrap: wrap; }
  .filtres input, .filtres select { padding: 10px 12px; border: 1px solid var(--bord); border-radius: 8px; background: #fff; }
  .filtres input { flex: 1; min-width: 180px; }

  /* ===== PRODUITS ===== */
  #liste { max-width: 900px; margin: 0 auto; padding: 0 20px 40px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .produit { background: #fff; border: 1px solid var(--bord); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .visuel { background: var(--vert-clair); font-size: 3.5rem; text-align: center; padding: 22px 0; }
  .infos { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .infos h3 { font-size: 1.05rem; }
  .infos .cat { color: var(--gris); font-size: .85rem; }
  .prix { font-weight: bold; color: var(--vert); font-size: 1.1rem; margin-top: auto; padding-top: 6px; }
  .ajouter { margin-top: 8px; background: var(--vert); color: #fff; border: 0; border-radius: 8px; padding: 9px; cursor: pointer; }
  .ajouter:hover { background: #17482d; }
  .vide { grid-column: 1 / -1; color: var(--gris); padding: 30px 0; text-align: center; }

  /* ===== PANIER ===== */
  #panier { position: fixed; top: 0; right: 0; width: min(380px, 100%); height: 100%; background: #fff; border-left: 1px solid var(--bord); transform: translateX(100%); transition: transform .25s; z-index: 20; display: flex; flex-direction: column; }
  #panier.ouvert { transform: none; }
  #panier header { position: static; }
  #lignes { flex: 1; overflow-y: auto; padding: 14px 18px; }
  .ligne { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--bord); }
  .ligne small { color: var(--gris); display: block; }
  .qte button { width: 28px; height: 28px; border: 1px solid var(--bord); background: #fff; border-radius: 6px; cursor: pointer; }
  .qte span { display: inline-block; min-width: 24px; text-align: center; }
  .pied { padding: 16px 18px; border-top: 1px solid var(--bord); }
  .total { display: flex; justify-content: space-between; font-weight: bold; font-size: 1.15rem; margin-bottom: 12px; }
  #commander { width: 100%; background: #25a244; color: #fff; border: 0; border-radius: 8px; padding: 12px; font-weight: bold; cursor: pointer; }
  #commander:disabled { background: var(--bord); color: var(--gris); cursor: not-allowed; }
  #fermer { background: none; border: 0; color: #fff; font-size: 1.6rem; cursor: pointer; }

  footer { text-align: center; color: var(--gris); font-size: .9rem; padding: 20px; border-top: 1px solid var(--bord); }

  @media (prefers-reduced-motion: reduce) { #panier { transition: none; } }
</style>
</head>
<body>

<header>
  <h1 id="nom-boutique"></h1>
  <button id="btn-panier">Panier (<span id="nb">0</span>)</button>
</header>

<section class="intro">
  <h2>Nos articles et leurs prix</h2>
  <p>Choisissez vos articles, ajoutez-les au panier, puis envoyez votre commande directement sur WhatsApp.</p>
</section>

<section class="filtres">
  <input type="search" id="recherche" placeholder="Rechercher un article…" aria-label="Rechercher un article">
  <select id="categorie" aria-label="Filtrer par catégorie"></select>
</section>

<main id="liste"></main>

<footer id="pied-page"></footer>

<!-- Panier latéral -->
<aside id="panier" aria-label="Panier">
  <header>
    <h1>Votre panier</h1>
    <button id="fermer" aria-label="Fermer le panier">×</button>
  </header>
  <div id="lignes"></div>
  <div class="pied">
    <div class="total"><span>Total</span><span id="total">0 FCFA</span></div>
    <button id="commander" disabled>Commander sur WhatsApp</button>
  </div>
</aside>

<script>
/* =====================================================
   1) À PERSONNALISER : infos de la boutique
   ===================================================== */
const BOUTIQUE = {
  nom: "Boutique Chez Mike",
  whatsapp: "22900000000",      // numéro avec indicatif, sans + ni espaces
  adresse: "Cotonou, Bénin",
  devise: "FCFA"
};

/* =====================================================
   2) À PERSONNALISER : tes articles
   Pour ajouter un article, copie une ligne et change les valeurs.
   ===================================================== */
const PRODUITS = [
  { id: 1, nom: "Riz parfumé 5 kg",     categorie: "Alimentation", prix: 4500,  icone: "🍚" },
  { id: 2, nom: "Huile de palme 1 L",   categorie: "Alimentation", prix: 1500,  icone: "🫒" },
  { id: 3, nom: "Pagne wax 6 yards",    categorie: "Vêtements",    prix: 12000, icone: "🧵" },
  { id: 4, nom: "Sandales cuir",        categorie: "Vêtements",    prix: 8000,  icone: "👡" },
  { id: 5, nom: "Savon de ménage",      categorie: "Maison",       prix: 500,   icone: "🧼" },
  { id: 6, nom: "Seau plastique 15 L",  categorie: "Maison",       prix: 2000,  icone: "🪣" },
  { id: 7, nom: "Chargeur téléphone",   categorie: "Électronique", prix: 3500,  icone: "🔌" },
  { id: 8, nom: "Écouteurs filaires",   categorie: "Électronique", prix: 2500,  icone: "🎧" }
];

/* =====================================================
   3) LOGIQUE DU SITE (pas besoin de toucher au début)
   ===================================================== */
let panier = {};   // { idProduit: quantité }

const $ = (id) => document.getElementById(id);
const formater = (n) => n.toLocaleString("fr-FR") + " " + BOUTIQUE.devise;

/* --- Affichage des produits --- */
function afficherProduits() {
  const texte = $("recherche").value.trim().toLowerCase();
  const cat = $("categorie").value;
  const resultat = PRODUITS.filter(p =>
    (cat === "Toutes" || p.categorie === cat) &&
    p.nom.toLowerCase().includes(texte)
  );

  $("liste").innerHTML = resultat.length
    ? resultat.map(p => `
        <article class="produit">
          <div class="visuel" aria-hidden="true">${p.icone}</div>
          <div class="infos">
            <h3>${p.nom}</h3>
            <span class="cat">${p.categorie}</span>
            <span class="prix">${formater(p.prix)}</span>
            <button class="ajouter" data-id="${p.id}">Ajouter au panier</button>
          </div>
        </article>`).join("")
    : `<p class="vide">Aucun article trouvé. Essayez un autre mot ou une autre catégorie.</p>`;
}

/* --- Catégories --- */
function remplirCategories() {
  const cats = ["Toutes", ...new Set(PRODUITS.map(p => p.categorie))];
  $("categorie").innerHTML = cats.map(c => `<option>${c}</option>`).join("");
}

/* --- Panier --- */
function ajouter(id) { panier[id] = (panier[id] || 0) + 1; majPanier(); }
function changerQte(id, delta) {
  panier[id] = (panier[id] || 0) + delta;
  if (panier[id] <= 0) delete panier[id];
  majPanier();
}

function majPanier() {
  const ids = Object.keys(panier);
  let total = 0, nb = 0;

  $("lignes").innerHTML = ids.length
    ? ids.map(id => {
        const p = PRODUITS.find(x => x.id == id);
        const q = panier[id];
        total += p.prix * q; nb += q;
        return `
          <div class="ligne">
            <div>${p.nom}<small>${formater(p.prix)}</small></div>
            <div class="qte">
              <button data-id="${id}" data-d="-1" aria-label="Retirer un">−</button>
              <span>${q}</span>
              <button data-id="${id}" data-d="1" aria-label="Ajouter un">+</button>
            </div>
          </div>`;
      }).join("")
    : `<p class="vide">Votre panier est vide. Ajoutez un article pour commencer.</p>`;

  $("nb").textContent = nb;
  $("total").textContent = formater(total);
  $("commander").disabled = ids.length === 0;
}

/* --- Commande WhatsApp --- */
function commander() {
  let message = `Bonjour, je souhaite commander :\n`;
  let total = 0;
  Object.keys(panier).forEach(id => {
    const p = PRODUITS.find(x => x.id == id);
    const q = panier[id];
    total += p.prix * q;
    message += `- ${q} x ${p.nom} (${formater(p.prix * q)})\n`;
  });
  message += `\nTotal : ${formater(total)}`;
  window.open(`https://wa.me/${BOUTIQUE.whatsapp}?text=${encodeURIComponent(message)}`, "_blank");
}

/* --- Événements --- */
$("liste").addEventListener("click", e => {
  const b = e.target.closest(".ajouter");
  if (b) ajouter(b.dataset.id);
});
$("lignes").addEventListener("click", e => {
  const b = e.target.closest("button[data-id]");
  if (b) changerQte(b.dataset.id, Number(b.dataset.d));
});
$("recherche").addEventListener("input", afficherProduits);
$("categorie").addEventListener("change", afficherProduits);
$("btn-panier").addEventListener("click", () => $("panier").classList.add("ouvert"));
$("fermer").addEventListener("click", () => $("panier").classList.remove("ouvert"));
$("commander").addEventListener("click", commander);

/* --- Démarrage --- */
document.title = BOUTIQUE.nom;
$("nom-boutique").textContent = BOUTIQUE.nom;
$("pied-page").textContent = BOUTIQUE.nom + " · " + BOUTIQUE.adresse;
remplirCategories();
afficherProduits();
majPanier();
</script>
</body>
</html>
